,{"s":"jpbd-commercial-planning-guidelines","t":"rumah-selangorku-harapan-guidelines"},{"s":"jpbd-commercial-planning-guidelines","t":"pam2018"},{"s":"jpbd-housing-guidelines","t":"jpbd-gfa-definition"},{"s":"jpbd-housing-guidelines","t":"rumah-selangorku-harapan-guidelines"},{"s":"jpbd-housing-guidelines","t":"pam2018"},{"s":"rumah-selangorku-harapan-guidelines","t":"pam2018"},{"s":"act133-street-drainage-building-1974","t":"ubbl-2021"},{"s":"act133-street-drainage-building-1974","t":"lam-gc-2-2017-hda-stage-claim"},{"s":"act172-town-country-planning-1976","t":"act133-street-drainage-building-1974"},{"s":"act172-town-country-planning-1976","t":"ubbl-2021"},{"s":"spc-installation","t":"spc"},{"s":"spc","t":"tile-slip-resistance-standards"},{"s":"sikawall-603-acrylic","t":"msma-chapter-4-roof-drainage"},{"s":"tile-slip-resistance-standards","t":"spc-installation"}],CC={"checklist":"#2D6473","UBBL":"#8B4513","SPA":"#4A7C59","contracts":"#6B3FA0","Appointment":"#C9742E","LAM":"#1A6B8A","codes":"#5B7B9A","guidelines":"#3A7D5C","regulations":"#B34A4A","materials":"#7A7A5A","utilities":"#5A8A8A","spec":"#6A6A8A"},CL={"checklist":"Checklists","UBBL":"UBBL","SPA":"SPA","contracts":"Contracts","Appointment":"Appointment","LAM":"LAM","codes":"Codes","guidelines":"Guidelines","regulations":"Regulations","materials":"Materials","utilities":"Utilities","spec":"Specs"},CCL={"checklist":"#96b2b9","UBBL":"#c5a289","SPA":"#a5beac","contracts":"#b59fd0","Appointment":"#e4ba97","LAM":"#8db5c5","codes":"#adbdcd","guidelines":"#9dbeae","regulations":"#d9a5a5","materials":"#bdbdad","utilities":"#adc5c5","spec":"#b5b5c5"};
let W=window.innerWidth,H=window.innerHeight;
const svg=d3.select('svg').attr('width',W).attr('height',H);
const g=svg.append('g');
const nbr=new Map(ND.map(d=>[d.id,new Set()]));
for(const e of ED){if(nbr.has(e.s))nbr.get(e.s).add(e.t);if(nbr.has(e.t))nbr.get(e.t).add(e.s);}
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sl=n=>n.length>22?n.slice(0,21)+'...':n;
const pack=d3.pack().size([W,H]).padding(d=>d.depth===0?10:2);
let root=null,nodeMap=new Map(),focus=null;
function buildData(){
  const q=document.getElementById('S').value.toLowerCase().trim();
  const chips=[...document.querySelectorAll('.cf')];
  const on=chips.filter(c=>c.classList.contains('on'));
  const cats=new Set(on.length?on.map(c=>c.dataset.c):chips.map(c=>c.dataset.c));
  const leaves=ND.filter(d=>cats.has(d.cat)&&(!q||d.n.toLowerCase().includes(q)||d.cl.toLowerCase().includes(q)||(d.su||'').toLowerCase().includes(q)||(d.tg||[]).some(t=>t.toLowerCase().includes(q))));
  const by=new Map();
  for(const d of leaves){if(!by.has(d.cat))by.set(d.cat,[]);by.get(d.cat).push(d);}
  return {name:'root',children:[...by.entries()].map(e=>({name:e[0],children:e[1].map(d=>({id:d.id,n:d.n,sl:d.sl,cat:d.cat,value:d.deg+1}))}))};
}
function render(){
  g.selectAll('*').remove();
  const data=buildData();if(!data.children.length)return;
  root=pack(d3.hierarchy(data).sum(d=>d.value).sort((a,b)=>b.value-a.value));
  nodeMap=new Map();
  root.each(n=>{if(n.data.id)nodeMap.set(n.data.id,n);});
  const gs=g.selectAll('g').data(root.descendants()).join('g')
    .attr('transform',d=>'translate('+d.x+','+d.y+')')
    .style('cursor',d=>d.depth===1?'pointer':'default')
    .on('click',(ev,d)=>{ev.stopPropagation();if(d.depth===1){zoomTo(d,450);}else if(d.depth===2){clearHL();highlight(d.data.id);openPanel(d.data.id);}});
  gs.filter(d=>d.depth>0).append('circle')
    .attr('r',d=>d.r)
    .attr('fill',d=>d.depth===1?(CC[d.data.name]||'#888'):(CC[d.data.cat]||'#888'))
    .attr('fill-opacity',d=>d.depth===1?0.12:1)
    .attr('stroke',d=>d.depth===1?'rgba(255,255,255,.22)':'rgba(255,255,255,.07)')
    .attr('stroke-width',d=>d.depth===1?1.6:0.5)
    .attr('opacity',d=>d.depth===1?0.5:0.88);
  gs.filter(d=>d.depth===1).append('text').attr('class','lab1')
    .attr('text-anchor','middle')
    .attr('x',d=>Math.max(40,Math.min(W-40,d.x))-d.x)
    .attr('y',d=>-d.r-7)
    .attr('fill',d=>CCL[d.data.name]||'rgba(255,255,255,.8)')
    .style('font-size',d=>Math.max(16,Math.min(22,d.r*0.18))+'px')
    .style('font-weight',600).text(d=>d.data.name);
  gs.filter(d=>d.depth===2).append('text').attr('class','lab2')
    .attr('text-anchor','middle').attr('dy','.35em')
    .attr('fill','#fff')
    .style('font-size',d=>Math.max(8,Math.min(11,d.r*0.24))+'px')
    .text(d=>d.data.sl||d.data.n||d.data.id);
  gs.filter(d=>d.depth===2).on('mouseenter',(ev,d)=>{TTn.text(d.data.n||d.data.id);TTc.text(CL[d.data.cat]||d.data.cat);TT.style('display','block').style('left',Math.min(ev.clientX+14,W-280)+'px').style('top',Math.min(ev.clientY+14,H-120)+'px');})
    .on('mousemove',ev=>{TT.style('left',Math.min(ev.clientX+14,W-280)+'px').style('top',Math.min(ev.clientY+14,H-120)+'px');})
    .on('mouseleave',()=>{TT.style('display','none');});
}
const zoom=d3.zoom().scaleExtent([1,64]).on('zoom',ev=>{
  const k=ev.transform.k;
  g.attr('transform',ev.transform);
  g.selectAll('text.lab2').attr('display',d=>(d.r*k>40||k>1.2)?null:'none');
  g.selectAll('text.lab1').attr('display',d=>k>1.2?'none':null);
});
svg.call(zoom);
function zoomTo(n,dur){
  if(!n)return;
  const k=Math.max(1,Math.min(64,(Math.min(W,H)*0.92)/(2*n.r)));
  const t=d3.zoomIdentity.translate(W/2-n.x*k,H/2-n.y*k).scale(k);
  focus=n.depth===1?n.data.name:null;
  document.querySelector('#P .s').textContent=focus?(focus+' - '+ND.filter(d=>d.cat===focus).length+' docs'):(ND.length+' docs - '+ED.length+' cross-references');
  if(dur)svg.transition().duration(dur).call(zoom.transform,t);else svg.call(zoom.transform,t);
}
svg.on('click',ev=>{if(ev.target===svg.node()){zoomTo(root,450);clearHL();closePanel();}});
function clearHL(){
  g.selectAll('circle').attr('opacity',d=>d.depth===1?0.5:0.88)
    .attr('stroke',d=>d.depth===1?'rgba(255,255,255,.22)':'rgba(255,255,255,.07)')
    .attr('stroke-width',d=>d.depth===1?1.6:0.5);
}
function highlight(id){
  const ns=nbr.get(id)||new Set();ns.add(id);
  g.selectAll('circle').attr('opacity',d=>d.depth===2?(ns.has(d.data.id)?1:0.05):0.15)
    .attr('stroke',d=>d.depth===2&&d.data.id===id?'#fff':'rgba(255,255,255,.07)')
    .attr('stroke-width',d=>d.data.id===id?2:0.5);
}
function closePanel(){document.getElementById('D').style.display='none';}
function openPanel(id){
  const d=ND.find(x=>x.id===id);if(!d)return;
  const rel=[...(nbr.get(id)||[])].map(n=>ND.find(x=>x.id===n)).filter(Boolean);
  const chip=rel.length?rel.map(r=>'<button class=rc data-id="'+r.id+'">'+esc(r.sl||sl(r.n))+'</button>').join(''):'<span class=no>No cross-references</span>';
  document.getElementById('Dc').innerHTML=
    '<div class=dh><span class=dot style="background:'+CC[d.cat]+'"></span><span class=dn>'+esc(d.n)+'</span><button id=Db>x</button></div>'+
    '<div class=dc>'+esc(d.cl)+(d.sc?' / '+esc(d.sc.replace(/[-_]/g,' ')):'')+'</div>'+
    '<div class=ds>'+esc(d.su)+'</div>'+
    '<div class=dr><b>'+d.deg+' connection'+(d.deg!==1?'s':'')+'</b> - '+esc(d.rp)+'</div>'+
    '<div class=rh>Related</div><div class=rr>'+chip+'</div>';
  document.getElementById('D').style.display='block';
  document.querySelectorAll('.rc').forEach(b=>{b.onclick=()=>focusDoc(b.dataset.id);});
  document.getElementById('Db').onclick=()=>{closePanel();clearHL();};
}
function focusDoc(id){
  document.querySelectorAll('.cf').forEach(c=>c.classList.add('on'));
  document.getElementById('S').value='';
  render();
  const n=nodeMap.get(id);if(!n)return;
  if(n.parent)zoomTo(n.parent,500);
  highlight(id);openPanel(id);
}
const TT=d3.select('#T'),TTn=TT.select('.tn'),TTc=TT.select('.tc');
const cats=[...new Set(ND.map(d=>d.cat))].sort();
const FC=d3.select('#Fl');
cats.forEach(c=>{FC.append('span').attr('class','cf on').attr('data-c',c)
  .html('<span class=d style="background:'+CC[c]+'"></span>'+CL[c])
  .on('click',function(){const el=d3.select(this);el.classed('on',!el.classed('on'));if(!document.querySelector('.cf.on'))d3.selectAll('.cf').classed('on',true);render();clearHL();closePanel();zoomTo(root,0);});});
const LG=d3.select('#L');
cats.forEach(c=>{LG.append('span').attr('class','li').html('<span class=d style="background:'+CC[c]+'"></span>'+CL[c]);});
document.getElementById('S').addEventListener('input',()=>{render();clearHL();closePanel();zoomTo(root,0);});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closePanel();clearHL();}});
window.addEventListener('resize',()=>{W=window.innerWidth;H=window.innerHeight;svg.attr('width',W).attr('height',H);pack.size([W,H]);render();zoomTo(root,0);});
render();zoomTo(root,0);
</script>
